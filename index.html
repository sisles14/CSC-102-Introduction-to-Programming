<!DOCTYPE html>
<html lang="en">
  <!-- The head tag contains the metadata about the document. -->
  <!-- It typically defines the document title, character set, styles, and other meta information. -->
  <!-- This is not displayed. -->
  <head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <!-- This is the title of the page -->
    <!-- This will appear in the tab at the top of the screen -->
    <title> Home Page </title>
    <!-- This is the css page -->
    <link rel = "stylesheet" href = "main.css">
  </head>
  <!-- The body tag contains all the contents of an HTML document, such as headings (<h1-5>), paragraphs (<p>), images (img), hyperlink (a), tables (tb), lists (<ol>/<ul>), etc. -->
  <body>
    <!-- This is the header of the page -->
    <h1> Welcome to the Home Page!! </h1>
    <!-- The p tag is the paragraph tag, it is used to define a paragragh meaning you can write more than one line on the pages -->
    <p>
      <img id = "lawandordersvu" src = "lawandordersvu.jpg">
    </p>
  </body>
</html>
